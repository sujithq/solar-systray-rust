name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/copilot-instructions.md"
      - "AGENTS.md"
  push:
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/copilot-instructions.md"
      - "AGENTS.md"

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::approx_constant
      - run: cargo test --workspace
