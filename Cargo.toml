[workspace]
resolver = "3"
members = ["crates/solar-core", "crates/solar-tray", "xtask"]
default-members = ["crates/solar-core", "crates/solar-tray"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
